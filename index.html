<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>WallCare Experts — Premium Painting & Quotation Studio</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-subtle: #f8fafc;
  --border: #e8ecf1;
  --border-strong: #d2dbe5;
  --ink: #142129;
  --ink-muted: #64748b;
  --ink-light: #94a3b8;
  
  /* Lordbank UI theme palette */
  --primary: #5cb87a;
  --primary-hover: #4ea86d;
  --primary-light: #eaf7ef;
  --primary-text: #1d6e38;
  
  --teal-dark: #224957;
  --teal-card: #204552;
  --teal-darker: #15323d;
  
  --amber: #f59e0b;
  --amber-light: #fef8e7;
  --amber-text: #b27b16;
  
  --rose: #ef4444;
  --rose-light: #fee2e2;
  
  --blue: #3b82f6;
  --blue-light: #eff6ff;

  --shadow-sm: 0 2px 4px rgba(20, 33, 41, 0.03);
  --shadow-card: 0 8px 24px -4px rgba(24, 39, 75, 0.04), 0 2px 6px -1px rgba(24, 39, 75, 0.02);
  --shadow-lg: 0 20px 40px -8px rgba(24, 39, 75, 0.08);
  --radius-card: 24px;
  --radius-pill: 9999px;
  --radius-input: 16px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; border: none; outline: none; }

/* Top Header Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 74px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  gap: 20px;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}
.brand-logo-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--teal-dark), var(--teal-darker));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 900;
  font-size: 19px;
  box-shadow: 0 4px 12px rgba(34, 73, 87, 0.25);
  position: relative;
}
.brand-logo-icon::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid #fff;
}
.brand-text h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.4px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 4px;
}
.brand-text h1 span { color: var(--primary); }
.brand-text small {
  display: block;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink-muted);
  font-weight: 700;
  margin-top: 2px;
}

/* Nav Pill Menu */
.top-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #edf2f6;
  padding: 5px 6px;
  border-radius: var(--radius-pill);
}
.nav-pill {
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-muted);
  background: transparent;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav-pill:hover { color: var(--ink); }
.nav-pill.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(92, 184, 122, 0.35);
}

/* Topbar Actions & User */
.top-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.search-pill {
  position: relative;
  width: 260px;
}
.search-pill input {
  width: 100%;
  height: 42px;
  padding: 0 16px 0 38px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--surface-subtle);
  font-size: 12.5px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.search-pill input:focus {
  border-color: var(--primary);
  background: #fff;
}
.search-pill svg {
  position: absolute;
  left: 14px;
  top: 13px;
  width: 16px;
  height: 16px;
  color: var(--ink-light);
}
.btn-new-quote {
  height: 42px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  background: linear-gradient(135deg, var(--teal-dark), var(--teal-darker));
  color: #fff;
  font-size: 12.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 4px 12px rgba(34, 73, 87, 0.2);
  transition: transform 0.15s;
}
.btn-new-quote:hover { transform: translateY(-1px); }

.user-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 8px;
  border-left: 1px solid var(--border);
}
.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a7f3d0, #34d399);
  color: #065f46;
  font-weight: 900;
  display: grid;
  place-items: center;
  font-size: 15px;
}
.user-info { font-size: 12px; }
.user-info b { display: block; color: var(--ink); font-weight: 800; }
.user-info span { color: var(--ink-muted); font-size: 10.5px; }

/* Main Container */
.main-wrapper {
  max-width: 1560px;
  margin: 0 auto;
  padding: 24px 28px 100px;
}

/* Breadcrumb */
.crumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-muted);
  margin-bottom: 20px;
}
.crumb span { color: var(--ink-light); }

/* Dashboard Hero with Lordbank aesthetic */
.dash-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(360px, 0.9fr);
  gap: 22px;
  align-items: start;
}
.left-dash { display: flex; flex-direction: column; gap: 20px; }
.right-dash { display: flex; flex-direction: column; gap: 20px; }

/* Greeting Hero Row */
.greeting-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 24px 28px;
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.greeting-content h2 {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -0.6px;
  margin: 0 0 6px;
  color: var(--ink);
}
.greeting-content p {
  margin: 0;
  color: var(--ink-muted);
  font-size: 13.5px;
}
.greeting-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-pill-light {
  height: 40px;
  padding: 0 18px;
  border-radius: var(--radius-pill);
  background: #fff;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn-pill-light:hover { background: var(--surface-subtle); border-color: var(--border-strong); }
.btn-pill-green {
  height: 40px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 12px rgba(92, 184, 122, 0.3);
}

/* Analytics Row (Dot Matrix, Dual Ratios, Profile Card) */
.analytics-hero-grid {
  display: grid;
  grid-template-columns: 240px 1fr 200px;
  gap: 16px;
}

/* Profile Card */
.profile-consultant-card {
  background: linear-gradient(180deg, #cde3ec 0%, #e2eff5 100%);
  border-radius: var(--radius-card);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.profile-photo {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin: 0 auto 10px;
  background: linear-gradient(135deg, var(--teal-dark), #407b94);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 34px;
  font-weight: 900;
  border: 4px solid #fff;
  box-shadow: 0 8px 16px rgba(0,0,0,0.1);
}
.profile-tag {
  align-self: center;
  background: rgba(20, 33, 41, 0.85);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 12px;
}
.profile-meta-bottom {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.profile-meta-bottom b { font-size: 12.5px; display: block; color: var(--ink); }
.profile-meta-bottom span { font-size: 10px; color: var(--ink-muted); }
.profile-quick-icons { display: flex; gap: 6px; }
.quick-circle {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--teal-dark);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 11px;
}

/* Dot Matrix Card */
.dot-matrix-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 22px 24px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.matrix-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.matrix-stat { display: flex; align-items: baseline; gap: 8px; }
.matrix-stat strong { font-size: 38px; font-weight: 900; letter-spacing: -1px; color: var(--ink); }
.matrix-stat small { font-size: 11px; color: var(--ink-muted); font-weight: 600; text-transform: uppercase; }
.badge-growth {
  background: var(--primary-light);
  color: var(--primary-text);
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 800;
}

/* Dot Grid Visualizer */
.dot-grid-wrap {
  margin: 16px 0 10px;
}
.dot-grid {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 8px;
  align-items: center;
}
.grid-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e2e8f0;
  transition: transform 0.2s;
}
.grid-dot.active-green { background: var(--primary); }
.grid-dot.active-teal { background: var(--teal-dark); }
.grid-dot.lg { width: 13px; height: 13px; }
.matrix-legend {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--ink-light);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Dual Ratio Cards */
.dual-ratio-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ratio-card-dark {
  background: var(--teal-card);
  color: #fff;
  border-radius: 20px;
  padding: 16px 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 6px 18px rgba(34, 73, 87, 0.2);
}
.ratio-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ratio-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.15);
  display: grid;
  place-items: center;
  font-size: 13px;
}
.ratio-card-dark strong { font-size: 26px; font-weight: 900; margin: 6px 0 2px; display: block; }
.ratio-card-dark span { font-size: 11px; opacity: 0.85; }

.ratio-card-light {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-card);
}
.ratio-card-light strong { font-size: 26px; font-weight: 900; margin: 6px 0 2px; display: block; color: var(--ink); }
.ratio-card-light span { font-size: 11px; color: var(--ink-muted); font-weight: 600; }

/* Lower Analytics Cards: Donut Gauge, Work Time, Bar Stats */
.lower-analytics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.card-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 22px 24px;
  box-shadow: var(--shadow-card);
}
.card-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-panel-head h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
}
.card-panel-head span { font-size: 11.5px; color: var(--ink-muted); }

/* Semi-Circle Gauge */
.gauge-wrap {
  display: flex;
  align-items: center;
  gap: 24px;
}
.gauge-visual {
  position: relative;
  width: 150px;
  height: 85px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}
.gauge-center-stat {
  text-align: center;
  position: absolute;
  bottom: 0;
}
.gauge-center-stat strong { font-size: 26px; font-weight: 900; color: var(--ink); display: block; line-height: 1; }
.gauge-center-stat small { font-size: 9px; color: var(--ink-muted); font-weight: 700; text-transform: uppercase; }
.gauge-legend {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.legend-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
}
.legend-label { display: flex; align-items: center; gap: 7px; color: var(--ink-muted); font-weight: 600; }
.legend-color-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-row b { font-weight: 800; color: var(--ink); }

/* Sparkline Wave Card */
.sparkline-box {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.spark-stat-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.spark-stat-row strong { font-size: 28px; font-weight: 900; color: var(--ink); }

/* Right Column: Salary / Take-home Financial Card + Activity Feed */
.salary-takehome-card {
  background: var(--teal-card);
  border-radius: var(--radius-card);
  padding: 24px;
  color: #fff;
  box-shadow: 0 12px 32px rgba(32, 69, 82, 0.28);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.pill-light-green {
  background: #74c995;
  color: var(--teal-darker);
  font-weight: 800;
  font-size: 11.5px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  display: inline-flex;
  justify-content: space-between;
  align-items: center;
}
.salary-two-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.salary-sub-box {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 16px;
  padding: 10px 14px;
  color: var(--ink);
}
.salary-sub-box small { display: block; font-size: 9px; text-transform: uppercase; color: var(--ink-muted); font-weight: 800; }
.salary-sub-box b { font-size: 16px; font-weight: 900; }
.salary-sub-box-dark {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 10px 14px;
}
.salary-sub-box-dark small { display: block; font-size: 9px; text-transform: uppercase; opacity: 0.7; font-weight: 800; }
.salary-sub-box-dark b { font-size: 16px; font-weight: 900; }

.takehome-total-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  padding-top: 14px;
}
.takehome-total-row span { font-size: 11.5px; opacity: 0.8; }
.takehome-total-row strong { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }

/* Recent Quotations Activity Panel */
.activity-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 22px 24px;
  box-shadow: var(--shadow-card);
}
.activity-list { display: flex; flex-direction: column; gap: 12px; }
.activity-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--surface-subtle);
  transition: background 0.15s;
}
.activity-item:hover { background: #eef3f7; }
.act-user-group { display: flex; align-items: center; gap: 10px; }
.act-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #e2e8f0;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  color: var(--teal-dark);
}
.act-text b { font-size: 12.5px; display: block; color: var(--ink); }
.act-text small { font-size: 10px; color: var(--ink-muted); }
.pill-status {
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-size: 10.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.pill-status.done { background: var(--primary-light); color: var(--primary-text); }
.pill-status.waiting { background: var(--amber-light); color: var(--amber-text); }
.pill-status.verified { background: var(--blue-light); color: var(--blue); }

/* =====================================================================
   QUOTATION WORKSHOP (Requirement 2 & 4)
   ===================================================================== */
.quote-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(320px, 0.8fr);
  gap: 22px;
  align-items: start;
}
.quote-stack { display: flex; flex-direction: column; gap: 18px; }

.qcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.qcard-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fbfcfd;
}
.qcard-head-title {
  display: flex;
  align-items: center;
  gap: 12px;
}
.step-number {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--teal-dark);
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  display: grid;
  place-items: center;
}
.qcard-head-title b { font-size: 15px; font-weight: 800; color: var(--ink); }
.qcard-head-title small { display: block; font-size: 11px; color: var(--ink-muted); }
.qcard-body { padding: 22px 24px; }

/* Forms */
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.form-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.full-col { grid-column: 1 / -1; }

.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 800;
  color: var(--ink-muted);
}
.fgroup input, .fgroup select, .fgroup textarea {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  outline: none;
  transition: all 0.15s;
}
.fgroup textarea {
  height: auto;
  min-height: 80px;
  padding: 10px 14px;
  resize: vertical;
}
.fgroup input:focus, .fgroup select:focus, .fgroup textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(92, 184, 122, 0.15);
}

/* Measurement Mini Grid */
.room-measure-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  background: var(--surface-subtle);
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.measure-cell label {
  display: block;
  font-size: 9.5px;
  text-transform: uppercase;
  color: var(--ink-muted);
  font-weight: 800;
  margin-bottom: 4px;
}
.measure-cell input {
  width: 100%;
  border: none;
  background: transparent;
  padding: 0;
  font-size: 18px;
  font-weight: 900;
  color: var(--ink);
  outline: none;
}
.measure-cell span { font-size: 10px; color: var(--ink-light); }

.room-card-item {
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #fff;
  padding: 16px;
  margin-bottom: 12px;
}
.room-header-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.room-header-line b { font-size: 14px; color: var(--ink); }

/* Scope of Work Table */
.scope-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 18px;
}
.scope-tbl {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
  font-size: 12px;
}
.scope-tbl th {
  background: #f8fafc;
  padding: 11px 12px;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--ink-muted);
  border-bottom: 1px solid var(--border);
  font-weight: 800;
}
.scope-tbl td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.scope-tbl input, .scope-tbl select {
  height: 36px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  font-size: 11.5px;
  font-weight: 600;
  background: #fff;
  width: 100%;
}
.scope-tbl input:focus, .scope-tbl select:focus {
  border-color: var(--primary);
}
.scope-tbl .tbl-narrow { width: 75px; text-align: right; }
.scope-tbl .tbl-rate { width: 95px; text-align: right; font-weight: 800; color: var(--teal-darker); }
.scope-tbl .tbl-amt { width: 100px; text-align: right; font-weight: 900; color: var(--ink); white-space: nowrap; }

/* Dedicated Select Product Button */
.btn-select-product-trigger {
  height: 36px;
  padding: 0 12px;
  border-radius: 10px;
  background: var(--primary-light);
  color: var(--primary-text);
  font-size: 11.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #c7ecd2;
  transition: all 0.15s;
}
.btn-select-product-trigger:hover {
  background: var(--primary);
  color: #fff;
}

/* Summary Box in Quotation */
.summary-side {
  position: sticky;
  top: 94px;
}
.summary-kpi-block {
  background: linear-gradient(135deg, var(--teal-card), var(--teal-darker));
  border-radius: 20px;
  padding: 22px;
  color: #fff;
  box-shadow: 0 8px 24px rgba(32, 69, 82, 0.25);
  margin-bottom: 16px;
}
.summary-kpi-block small {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  opacity: 0.8;
  font-weight: 800;
}
.summary-kpi-block strong {
  display: block;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -1px;
  margin: 6px 0 2px;
  color: #fff;
}
.summary-kpi-block span { font-size: 11px; opacity: 0.75; }

.summary-rows { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; font-size: 12.5px; }
.summary-row { display: flex; justify-content: space-between; color: var(--ink-muted); }
.summary-row b { color: var(--ink); font-weight: 800; }
.summary-grand-total {
  border-top: 2px dashed var(--border);
  padding-top: 12px;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  font-size: 17px;
  font-weight: 900;
  color: var(--teal-darker);
}

.summary-actions-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}
.btn-action-print {
  height: 44px;
  border-radius: 14px;
  background: var(--teal-dark);
  color: #fff;
  font-weight: 800;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: transform 0.15s;
}
.btn-action-print:hover { transform: translateY(-1px); }
.btn-action-wa {
  height: 44px;
  border-radius: 14px;
  background: #25d366;
  color: #fff;
  font-weight: 800;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
  transition: transform 0.15s;
}
.btn-action-wa:hover { transform: translateY(-1px); }

/* =====================================================================
   STEP-BY-STEP PRODUCT SELECTION MODAL (Requirement 2)
   ===================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }

.product-selector-sheet {
  background: #fff;
  width: min(1080px, 98vw);
  max-height: 90vh;
  border-radius: 28px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: modalPop 0.22s ease-out;
}
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.selector-header {
  padding: 20px 28px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.selector-header-left h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.selector-header-left p {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--ink-muted);
}
.btn-close-modal {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  color: var(--ink-muted);
  font-size: 18px;
  display: grid;
  place-items: center;
  transition: all 0.15s;
}
.btn-close-modal:hover { background: #fee2e2; color: #ef4444; }

/* Step Navigation Trail inside Modal */
.selector-steps-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
}
.step-crumb-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-muted);
}
.step-crumb-item.active { color: var(--primary-text); }
.step-crumb-item.completed { color: var(--ink); }
.step-circle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #e2e8f0;
  color: var(--ink-muted);
  font-size: 10px;
  display: grid;
  place-items: center;
}
.step-crumb-item.active .step-circle {
  background: var(--primary);
  color: #fff;
}
.step-crumb-item.completed .step-circle {
  background: var(--teal-dark);
  color: #fff;
}

.selector-body {
  padding: 24px 28px;
  overflow-y: auto;
  flex: 1;
}

/* Step 1: Brands Grid */
.brands-picker-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.brand-picker-card {
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 24px 20px;
  text-align: center;
  background: #fff;
  transition: all 0.2s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}
.brand-picker-card:hover {
  border-color: var(--primary);
  transform: translateY(-3px);
  box-shadow: var(--shadow-card);
}
.brand-icon-art {
  width: 70px;
  height: 70px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 26px;
  font-weight: 900;
  color: #fff;
  margin-bottom: 14px;
}
.brand-picker-card h4 {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 800;
}
.brand-picker-card p {
  margin: 0 0 14px;
  font-size: 11.5px;
  color: var(--ink-muted);
  line-height: 1.45;
}
.badge-count {
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  color: var(--ink);
  font-size: 11px;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}

/* Step 2: Categories Grid */
.cat-picker-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.cat-picker-card {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 18px;
  background: #fff;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.cat-picker-card:hover {
  border-color: var(--primary);
  background: var(--primary-light);
}
.cat-picker-card b { font-size: 13.5px; color: var(--ink); display: block; }
.cat-picker-card small { font-size: 11px; color: var(--ink-muted); }

/* Step 3: Product Cards Grid */
.product-picker-search-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}
.product-picker-search-bar input {
  flex: 1;
  height: 44px;
  padding: 0 16px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-strong);
  font-size: 13px;
  outline: none;
}
.product-picker-search-bar input:focus { border-color: var(--primary); }

.product-picker-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.pcard {
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  background: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.pcard:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-card);
}
.pcard-top {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.pcard-art {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  color: #fff;
  font-weight: 900;
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
}
.pcard-title-grp h4 {
  margin: 0;
  font-size: 14.5px;
  font-weight: 800;
  color: var(--ink);
}
.pcard-meta {
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 2px;
}
.pcard-desc {
  font-size: 11.5px;
  color: var(--ink-muted);
  line-height: 1.45;
  margin: 0;
}
.pcard-specs-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  background: var(--surface-subtle);
  border-radius: 12px;
  padding: 8px 10px;
}
.spec-mini-box small {
  display: block;
  font-size: 9px;
  text-transform: uppercase;
  color: var(--ink-light);
  font-weight: 800;
}
.spec-mini-box b {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ink);
}

.pcard-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: 4px;
}
.pcard-rate-label small { font-size: 9px; color: var(--ink-muted); text-transform: uppercase; font-weight: 800; display: block; }
.pcard-rate-label b { font-size: 16px; font-weight: 900; color: var(--teal-darker); }

.btn-choose-this {
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  background: var(--primary);
  color: #fff;
  font-size: 11.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn-choose-this:hover { background: var(--primary-hover); }

/* Brand Gradients */
.brand-asian { background: linear-gradient(135deg, #d97706, #92400e); }
.brand-berger { background: linear-gradient(135deg, #dc2626, #991b1b); }
.brand-birla { background: linear-gradient(135deg, #2563eb, #1e40af); }

/* Toast */
.toast-msg {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--teal-darker);
  color: #fff;
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 12.5px;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  z-index: 200;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast-msg.show {
  transform: translateY(0);
  opacity: 1;
}

/* =====================================================================
   PRINT & A4 PROFESSIONAL PDF OUTPUT (Requirement 4)
   ===================================================================== */
#printSheet { display: none; }

@media print {
  @page {
    size: A4 portrait;
    margin: 8mm 10mm;
  }
  
  html, body {
    background: #ffffff !important;
    color: #111827 !important;
    font-size: 9.5pt;
    margin: 0 !important;
    padding: 0 !important;
    font-family: 'Plus Jakarta Sans', Arial, sans-serif !important;
  }
  
  /* Hide non-print UI */
  .topbar, .top-nav, .crumb, .qcard-head button, .summary-actions-grid, .modal-overlay, .toast-msg, .app-layout {
    display: none !important;
  }
  
  #printSheet {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
}

/* Print Sheet Styling - Strictly 1 Page Optimized */
.print-doc {
  background: #fff;
  font-family: 'Plus Jakarta Sans', Arial, sans-serif;
  color: #1a202c;
  line-height: 1.35;
}
.print-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 12px;
  border-bottom: 2px solid #224957;
}
.print-brand-left h2 {
  margin: 0;
  font-size: 22pt;
  font-weight: 900;
  color: #224957;
  letter-spacing: -0.5px;
}
.print-brand-left h2 span { color: #5cb87a; }
.print-brand-left p {
  margin: 3px 0 0;
  font-size: 7.5pt;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 800;
  color: #64748b;
}
.print-company-right {
  text-align: right;
  font-size: 7.5pt;
  color: #475569;
  line-height: 1.3;
}
.print-company-right b {
  font-size: 9.5pt;
  color: #0f172a;
  display: block;
  margin-bottom: 2px;
}

.print-meta-strip {
  display: flex;
  justify-content: space-between;
  background: #f1f5f9;
  border-radius: 6px;
  padding: 6px 12px;
  margin: 10px 0;
  font-size: 8pt;
}
.print-meta-strip b { color: #0f172a; }

.print-two-col-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 10px;
}
.print-info-box {
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 7.8pt;
}
.print-info-box h5 {
  margin: 0 0 4px;
  font-size: 8pt;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #224957;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: 3px;
}
.print-info-box div { margin: 2px 0; }

.print-measure-bar {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 7.5pt;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
}
.print-measure-bar b { color: #224957; }

.print-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 10px;
  font-size: 7.5pt;
}
.print-table th {
  background: #224957;
  color: #ffffff;
  padding: 5px 6px;
  text-align: left;
  font-size: 7pt;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.print-table td {
  padding: 4px 6px;
  border-bottom: 1px solid #e2e8f0;
  vertical-align: middle;
}
.print-table tr:nth-child(even) td { background: #fbfcfe; }

.print-commercial-grid {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 14px;
  margin-top: 6px;
}
.print-terms {
  font-size: 7pt;
  color: #475569;
}
.print-terms h6 {
  margin: 0 0 3px;
  font-size: 7.5pt;
  text-transform: uppercase;
  color: #224957;
}
.print-terms ul {
  margin: 0;
  padding-left: 14px;
}
.print-terms li { margin-bottom: 2px; }

.print-finance-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 7.8pt;
}
.print-finance-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
  color: #475569;
}
.print-grand-row {
  display: flex;
  justify-content: space-between;
  border-top: 1.5px solid #224957;
  padding-top: 5px;
  margin-top: 4px;
  font-size: 10pt;
  font-weight: 900;
  color: #224957;
}

.print-sign-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 24px;
  padding-top: 8px;
  font-size: 7.5pt;
  color: #64748b;
}
.print-sign-box {
  text-align: center;
  width: 170px;
}
.print-sign-line {
  border-top: 1px dashed #94a3b8;
  margin-top: 28px;
  padding-top: 4px;
  font-weight: 700;
  color: #334155;
}
</style>

<div class="app-layout">

  </main>

<!-- Step-by-Step Product Selection Modal (Requirement 2) -->
<div class="modal-overlay" id="productModal" onclick="if(event.target===this)closeProductModal()">
  <div class="product-selector-sheet">
    <div class="selector-header">
      <div class="selector-header-left">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Select Product from Catalog
        </h3>
        <p>Choose brand &rarr; category &rarr; verified product with official rates & coverage</p>
      </div>

function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5cb87a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ' + msg;
  el.classList.add('show');
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

function money(num) {
  return '₹' + Number(num || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getRoomArea(r) {
  const L = Number(r.length) || 0, W = Number(r.width) || 0, H = Number(r.height) || 0, open = Number(r.openings) || 0;
  const walls = Math.max(0, 2 * (L + W) * H - open);
  const ceil = L * W;
  return { walls, ceil, total: walls + ceil };
}

function calculateMeasuredTotals() {
  let interior = 0, exterior = 0, ceil = 0;
  quoteDraft.rooms.forEach(r => {
    const a = getRoomArea(r);
    if (r.zone === 'Exterior') {
      exterior += a.walls;
    } else {
      interior += a.walls;
      ceil += a.ceil;
    }
  });
  return { interior, exterior, ceil, total: interior + exterior + ceil };
}

function calculateLineItem(item) {
  const area = Number(item.area) || 0;
  const coats = Math.max(1, Number(item.coats) || 1);
  const coverage = Number(item.coverage) || 0;
  
  // Calculate quantity in litres/kgs if coverage given
  let qty = Number(item.qty) || 0;
  if (coverage > 0 && area > 0) {
    qty = (area * coats) / coverage;
  } else if (!qty) {
    qty = area > 0 ? area : 1;
  }
  
  const rate = Number(item.rate) || 0;
  // If user entered rate per sq.ft and item has area, amount = area * rate
  // Else if item has qty and no area, amount = qty * rate
  const amount = area > 0 ? (area * rate) : (qty * rate);
  
  return { area, coats, coverage, qty, rate, amount };
}

function calculateQuoteTotals() {
  let subtotal = 0;
  let materialSubtotal = 0;
  let labourSubtotal = 0;
  
  quoteDraft.items.forEach(x => {
    const calc = calculateLineItem(x);
    subtotal += calc.amount;
    if (x.type === 'Labour') labourSubtotal += calc.amount;
    else materialSubtotal += calc.amount;
  });
  
  const discountPct = Number(quoteDraft.discount) || 0;
  const discountAmt = (subtotal * discountPct) / 100;
  const taxable = Math.max(0, subtotal - discountAmt);
  const gstPct = Number(quoteDraft.gst) || 0;
  const gstAmt = (taxable * gstPct) / 100;
  const grandTotal = taxable + gstAmt;
  
  return {
    subtotal,
    materialSubtotal,
    labourSubtotal,
    discountPct,
    discountAmt,
    taxable,
    gstPct,
    gstAmt,
    grandTotal
  };
}

// Set Active View
function setView(v) {
  currentView = v;
  document.querySelectorAll('.nav-pill').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === v);
  });
  renderApp();
}

function handleNavSearch(query) {
  if (currentView !== 'catalog') {
    setView('catalog');
  }
  const searchInput = document.getElementById('catalogFilterInput');
  if (searchInput) {
    searchInput.value = query;
    renderCatalogGrid();
  }
}

// Main Render Function
function renderApp() {
  const container = document.getElementById('mainContent');
  if (!container) return;

  if (currentView === 'dashboard') {
    container.innerHTML = renderDashboardHTML();
  } else if (currentView === 'quotes') {
    container.innerHTML = renderQuotationsHTML();
    updateLiveQuoteCalculations();
  } else if (currentView === 'catalog') {
    container.innerHTML = renderCatalogHTML();
    renderCatalogGrid();
  } else if (currentView === 'pricing') {
    container.innerHTML = renderPricingBookHTML();
  }
}

function updateScopeItemField(idx, key, val) {

function updateLiveQuoteCalculations() {
  const qTotals = calculateQuoteTotals();
  const setTxt = (id, txt) => {

function saveCurrentQuote() {
  const t = calculateQuoteTotals();
  const snapshot = Object.assign({}, quoteDraft, {
    totals: t,
    savedAt: new Date().toISOString()
  });
  const existingIdx = quotes.findIndex(q => q.number === snapshot.number);
  if (existingIdx >= 0) {
    quotes[existingIdx] = snapshot;
  } else {
    quotes.unshift(snapshot);
  }
  saveLocalState();
  renderApp();
  toast('Quotation ' + snapshot.number + ' saved successfully!');
}

function startNewQuote() {
  quoteDraft = createFreshQuote();
  saveLocalState();
  renderApp();
  toast('Started new quotation draft');
}

function loadSavedQuote(qNum) {
  const found = quotes.find(q => q.number === qNum);
  if (found) {
    quoteDraft = JSON.parse(JSON.stringify(found));
    saveLocalState();
    setView('quotes');
    toast('Loaded ' + qNum);
  }
}

function confirmProductSelection(productId) {
  const p = products.find(x => x.id === productId);
  if (!p) return;

  const defaultRoom = quoteDraft.rooms[0]?.name || 'Living Room';
  const defaultZone = (p.category.includes('Exterior') || p.name.includes('Exterior')) ? 'Exterior' : 'Interior';
  const workType = p.category.includes('Putty') ? 'Putty' : p.category.includes('Primer') ? 'Primer' : p.category.includes('Waterproof') ? 'Waterproofing' : 'Topcoat';
  
  // Calculate default room area
  const matchedRoom = quoteDraft.rooms.find(r => r.name === defaultRoom);
  const roomAreaCalc = matchedRoom ? getRoomArea(matchedRoom) : { walls: 500, ceil: 180, total: 680 };
  const targetArea = defaultZone === 'Exterior' ? (roomAreaCalc.walls || 800) : (roomAreaCalc.walls || 500);

  const newLineItem = {
    id: 'i-' + Date.now(),
    type: 'Material',
    room: defaultRoom,
    zone: defaultZone,
    work: workType,
    productId: p.id,
    description: p.brand + ' · ' + p.name + ' (' + p.subcategory + ')',
    area: targetArea,
    coats: p.recommended_coats,
    coverage: p.coverage,
    qty: (targetArea * p.recommended_coats) / p.coverage,
    rate: p.default_rate // User can edit this price in the quote anytime!
  };

  if (targetScopeIndex !== null && quoteDraft.items[targetScopeIndex]) {
    quoteDraft.items[targetScopeIndex] = Object.assign({}, quoteDraft.items[targetScopeIndex], newLineItem, {
      id: quoteDraft.items[targetScopeIndex].id
    });
  } else {
    quoteDraft.items.push(newLineItem);
  }

  saveLocalState();
  closeProductModal();
  renderApp();
  toast('Added ' + p.name + ' to quotation');
}

function updateModalStepIndicator(stepNum) {
  const i1 = document.getElementById('stepIndicator1');
  const i2 = document.getElementById('stepIndicator2');
  const i3 = document.getElementById('stepIndicator3');
  if (!i1 || !i2 || !i3) return;

  [i1, i2, i3].forEach((el, idx) => {
    el.classList.remove('active', 'completed');
    if (idx + 1 === stepNum) el.classList.add('active');
    else if (idx + 1 < stepNum) el.classList.add('completed');
  });
}

function _pickCategory(catName) {
  _catalogCategory = catName;
  const root = document.getElementById('catalogRoot');
  if (root) _renderProductGrid(root);
}

function _renderProductGrid(root) {
  const clr = { 'Asian Paints':'#e8521a', 'Berger Paints':'#7e22ce', 'Birla Opus':'#111' };
  const color = clr[_catalogBrand] || 'var(--primary)';
  const list = products.filter(p => p.brand === _catalogBrand && (!_catalogCategory || p.category === _catalogCategory));

  root.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px">' +
      '<button onclick="_catalogBrand=null;_catalogCategory=null;renderCatalogGrid()" style="background:white;border:1.5px solid var(--border);border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:12px">⌂ Brands</button>' +
      '<button onclick="_catalogCategory=null;renderCatalogGrid()" style="background:white;border:1.5px solid var(--border);border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:12px">← Categories</button>' +
      '<span style="font-weight:800;color:' + color + '">' + _catalogBrand + '</span>' +
      '<span style="color:var(--ink-muted)">›</span>' +
      '<span style="font-weight:700;color:var(--ink)">' + (_catalogCategory || 'All') + '</span>' +
      '<span style="color:var(--ink-muted);font-size:12px">(' + list.length + ' products)</span>' +
    '</div>' +
    '<div class="product-picker-list">' + renderProductPickerCardsHTML(list) + '</div>';
}

function filterCatalogByBrand(b) {
  _catalogBrand = (b === 'All Brands') ? null : b;

}


/* =====================================================================

   ===================================================================== */
function renderPricingBookHTML() {
  const brandColors = { 'Asian Paints':'#e8521a', 'Berger Paints':'#7e22ce', 'Birla Opus':'#111' };
  const brandList = ['Asian Paints', 'Berger Paints', 'Birla Opus'];

  const tabHtml = brandList.map((b, i) => {
    const cnt = products.filter(p => p.brand === b).length;
    return '<button id="pb-tab-' + i + '" onclick="switchPriceTab(' + i + ')" style="' +
      'padding:8px 20px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:13px;' +
      'background:' + (i === 0 ? brandColors[b] : 'white') + ';' +
      'color:' + (i === 0 ? 'white' : 'var(--ink-muted)') + ';' +
      'border:1.5px solid ' + (i === 0 ? brandColors[b] : 'var(--border)') + ';transition:all .18s">' +
      b + ' <span style="opacity:.75;font-size:11px">(' + cnt + ')</span>' +
    '</button>';
  }).join('');

  const buildTable = (brand) => {
    const rows = products.filter(p => p.brand === brand).map(p =>
      '<tr>' +
        '<td style="font-weight:600;max-width:180px">' + esc(p.name) + '</td>' +
        '<td><span style="background:#f0f4f8;padding:2px 8px;border-radius:6px;font-size:11px">' + esc(p.category) + '</span></td>' +
        '<td>' + p.coverage + ' sq.ft/' + p.unit + '</td>' +
        '<td style="text-align:center">' + p.recommended_coats + '</td>' +
        '<td>' + money(p.mrp) + '</td>' +
        '<td>' +
          '<input class="tbl-rate" type="number" step="0.5" value="' + p.default_rate + '" ' +
          'style="width:80px" ' +
          'onchange="(function(v){var pr=products.find(function(x){return x.id===\'' + p.id + '\';});if(pr){pr.default_rate=Number(v)||0;saveLocalState();toast(\'Updated \'+pr.name+\' rate\');}})(this.value)"/>' +
        '</td>' +
      '</tr>'
    ).join('');
    return '<div style="overflow-x:auto"><table class="scope-tbl" style="width:100%">' +
      '<thead><tr><th>Product Name</th><th>Category</th><th>Coverage</th>' +
      '<th style="text-align:center">Coats</th><th>Benchmark MRP</th><th>Working Rate (₹/sq.ft)</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  };

  const panels = brandList.map((b, i) =>
    '<div id="pb-panel-' + i + '" style="display:' + (i === 0 ? 'block' : 'none') + '">' +
      buildTable(b) +
    '</div>'
  ).join('');

  return '<div class="crumb">Portal <span>›</span> Working Price Book</div>' +
    '<div class="qcard">' +
      '<div class="qcard-head">' +
        '<div>' +
          '<b>Painter &amp; Dealer Working Rate Book</b>' +
          '<small>All ' + products.length + ' products across 3 brands — edit any rate, changes saved locally</small>' +
        '</div>' +
        '<button class="btn-pill-green" onclick="saveLocalState();toast(\'All rates saved!\');">💾 Save All Rates</button>' +
      '</div>' +
      '<div class="qcard-body">' +
        '<div style="display:flex;gap:10px;margin-bottom:20px">' + tabHtml + '</div>' +
        panels +
      '</div>' +
    '</div>';
}

function switchPriceTab(idx) {
  const brandColors = { 'Asian Paints':'#e8521a', 'Berger Paints':'#7e22ce', 'Birla Opus':'#111' };
  const brandList = ['Asian Paints', 'Berger Paints', 'Birla Opus'];
  brandList.forEach(function(b, i) {
    const tab = document.getElementById('pb-tab-' + i);
    const panel = document.getElementById('pb-panel-' + i);
    if (!tab || !panel) return;
    const active = i === idx;
    tab.style.background = active ? brandColors[b] : 'white';
    tab.style.color = active ? 'white' : 'var(--ink-muted)';
    tab.style.borderColor = active ? brandColors[b] : 'var(--border)';
    panel.style.display = active ? 'block' : 'none';
  });
}
