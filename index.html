function freshQuote(){return {number:nextQuoteNumber(),date:new Date().toISOString().slice(0,10),customer:'',phone:'',email:'',site:'',city:'',projectType:'Residential',propertyType:'Apartment',floors:1,validity:'15 days',discount:0,gst:18,advance:0,laborInterior:0,laborExterior:0,notes:'',rooms:[],items:[]}}
if(!quoteDraft)quoteDraft=freshQuote();
function nextQuoteNumber(){return 'PP-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6)}
function saveLocal(){localStorage.setItem('paintpro_quotes',JSON.stringify(quotes));localStorage.setItem('paintpro_quote_draft',JSON.stringify(quoteDraft));localStorage.setItem('paintpro_product_prices',JSON.stringify(productPrices));localStorage.setItem('paintpro_favorites',JSON.stringify([...favorites]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function roomArea(r){const L=Number(r.length)||0,W=Number(r.width)||0,H=Number(r.height)||0,open=Number(r.openings)||0;const walls=Math.max(0,2*(L+W)*H-open),ceil=L*W;return {walls,ceil,total:walls+ceil}}
function measured(){return quoteDraft.rooms.reduce((a,r)=>{const x=roomArea(r);if(r.zone==='Exterior')a.exterior+=x.walls;else a.interior+=x.walls;a.ceil+=x.ceil;return a},{interior:0,exterior:0,ceil:0})}
function calcItem(x){const room=quoteDraft.rooms.find(r=>r.name===x.room);let area=Number(x.area)||0;if(!area&&room){const a=roomArea(room);area=x.work==='Ceiling'?a.ceil:a.walls}const coats=Math.max(1,Number(x.coats)||1),coverage=Number(x.coverage)||0;const qty=coverage?area*coats/coverage:(Number(x.qty)||1);const rate=Number(x.rate)||0;return {area,qty,rate,amount:qty*rate}}
function quoteTotals(){return quoteDraft.items.reduce((a,x)=>{const v=calcItem(x);a.sub+=v.amount;return a},{sub:0})}
function totals(){const q=quoteTotals(),disc=q.sub*(Number(quoteDraft.discount)||0)/100,taxable=Math.max(0,q.sub-disc),tax=taxable*(Number(quoteDraft.gst)||0)/100;return {...q,disc,taxable,tax,total:taxable+tax}}
function artClass(p){return p.brand.includes('Berger')?'brand-berger':p.brand.includes('Asian')?'brand-asian':'brand-birla'}
function art(p,big=false){return `<div class="prod-art ${artClass(p)}" style="${big?'min-height:220px;width:100%;':''}">${esc(p.initials)}</div>`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}

function onGlobalSearch(){if(!['products','favorites','pricing'].includes(view))setView('products');else renderProducts()}
function render(){const m=document.getElementById('main');if(view==='dashboard')m.innerHTML=dashboard();else if(view==='products')m.innerHTML=productsPage(false);else if(view==='favorites')m.innerHTML=productsPage(true);else if(view==='categories')m.innerHTML=categoriesPage();else if(view==='shades')m.innerHTML=shadesPage();else if(view==='quotes')m.innerHTML=quotesPage();else if(view==='pricing')m.innerHTML=pricingPage();else m.innerHTML=dashboard();updateActiveNav();renderProducts();if(view==='pricing')renderPricingRows();if(view==='quotes')updateQuoteSummary()}
function dashboard(){const m=measured();return `<div class="crumb">Workspace <span>›</span> Dashboard</div><section class="hero"><div><div class="hero-tag">● premium quotation workflow</div><h1>Measure. Scope. Quote.</h1><p>A professional painter workspace for the three-brand catalog. Build room-by-room measurements, split interior and exterior work, attach products, set labour and rates, and issue a client-ready quotation.</p></div><div class="hero-actions"><button class="btn gold" onclick="startNewQuote();setView('quotes')">＋ New Quotation</button><button class="btn outline" onclick="setView('products')">Browse Catalog</button></div></section><section class="metrics"><div class="metric"><div class="label">Catalog Products</div><div class="value">${products.length}</div></div><div class="metric"><div class="label">Brands</div><div class="value">3</div></div><div class="metric"><div class="label">Rooms</div><div class="value">${quoteDraft.rooms.length}</div></div><div class="metric"><div class="label">Measured Area</div><div class="value">${Math.round(m.interior+m.exterior+m.ceil).toLocaleString('en-IN')}</div><div class="meta">sq.ft</div></div><div class="metric"><div class="label">Saved Quotes</div><div class="value">${quotes.length}</div></div></section><div class="workspace"><section class="panel"><div class="panel-head"><h2>Quick product discovery</h2><button class="pill gold" onclick="setView('products')">View catalog →</button></div><div class="toolbar">${brands.map(b=>`<button class="pill ${brand===b?'active':''}" onclick="brand='${esc(b)}';setView('products')">${esc(b)}</button>`).join('')}</div><div id="productList" class="product-list"></div></section><section class="panel"><div class="panel-head"><h2>Quotation structure</h2></div><div class="side-card"><div class="brand-chip"><div class="brand-dot" style="background:var(--dark)">1</div><div><strong>Project & Customer</strong><small>Client, site and commercial identity</small></div></div><div class="brand-chip"><div class="brand-dot" style="background:var(--dark)">2</div><div><strong>Rooms & Measurements</strong><small>Length, width, height, openings</small></div></div><div class="brand-chip"><div class="brand-dot" style="background:var(--dark)">3</div><div><strong>Work Scope</strong><small>Interior, exterior, coats and products</small></div></div><div class="brand-chip"><div class="brand-dot" style="background:var(--gold)">4</div><div><strong>Issue Quotation</strong><small>Premium print / PDF output</small></div></div></div></section></div>`}
function productsPage(fav=false){return `<div class="crumb">Catalog <span>›</span> ${fav?'Saved Products':'Explore Products'}</div><section class="panel"><div class="panel-head"><h2>${fav?'Saved Products':'Product Catalog'}</h2><span class="meta">${products.length} products · 3 brands</span></div><div class="toolbar"><button class="pill ${brand==='All Brands'?'active':''}" onclick="brand='All Brands';renderProducts()">All</button>${brands.slice(1).map(b=>`<button class="pill ${brand===b?'active':''}" onclick="brand='${esc(b)}';renderProducts()">${esc(b)}</button>`).join('')}<select class="pill" onchange="sort=this.value;renderProducts()"><option>Featured</option><option>Name A–Z</option><option>Brand</option></select></div><div class="toolbar"><select class="pill" onchange="category=this.value;renderProducts()"><option>All Categories</option>${cats.map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="pill" onclick="category='All Categories';renderProducts()">Clear</button></div><div id="productList" class="product-list"></div><div id="pager" style="padding:15px;text-align:center"></div></section>`}
function renderProducts(){const list=document.getElementById('productList');if(!list)return;let q=(document.getElementById('globalSearch')?.value||'').toLowerCase();let arr=products.filter(p=>(brand==='All Brands'||p.brand===brand)&&(category==='All Categories'||p.category===category)&&(!q||`${p.name} ${p.brand} ${p.category} ${p.subcategory} ${p.description}`.toLowerCase().includes(q)));if(view==='favorites')arr=arr.filter(p=>favorites.has(p.id));if(sort==='Name A–Z')arr.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='Brand')arr.sort((a,b)=>a.brand.localeCompare(b.brand)||a.name.localeCompare(b.name));const total=arr.length,pages=Math.max(1,Math.ceil(total/pageSize));if(page>pages)page=pages;const shown=arr.slice((page-1)*pageSize,page*pageSize);list.innerHTML=shown.length?shown.map(row).join(''):`<div class="empty">No products match the current filters.</div>`;const pager=document.getElementById('pager');if(pager)pager.innerHTML=total?`<span class="meta">Showing ${(page-1)*pageSize+1}–${Math.min(page*pageSize,total)} of ${total}</span><br><button class="pill" onclick="page=Math.max(1,page-1);renderProducts()">←</button> <button class="pill" onclick="page=Math.min(${pages},page+1);renderProducts()">→</button>`:''}
function row(p){return `<article class="product-row"><div class="prod-art ${artClass(p)}">${esc(p.initials)}</div><div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.brand)} · ${esc(p.category)} · ${esc(p.subcategory)}</div><div class="desc">${esc(p.description)}</div></div><div class="actions"><button class="icon-btn" onclick="toggleFav('${p.id}',event)">${favorites.has(p.id)?'♥':'♡'}</button><button class="icon-btn gold" onclick="quickAddQuote('${p.id}',event)">＋</button><button class="icon-btn" onclick="openProduct('${p.id}')">›</button></div></article>`}
function categoriesPage(){return `<div class="crumb">Catalog <span>›</span> Categories</div><section class="panel"><div class="panel-head"><h2>Product Categories</h2><span class="meta">${cats.length} categories</span></div><div class="side-card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px">${cats.map(c=>`<button class="brand-chip" onclick="category='${esc(c)}';setView('products')"><div class="brand-dot" style="background:var(--dark)">▦</div><div><strong>${esc(c)}</strong><small>${products.filter(p=>p.category===c).length} products across brands</small></div><span style="margin-left:auto">›</span></button>`).join('')}</div></section>`}
function shadesPage(){const colors=['#efe1c9','#dbc7aa','#cfaa8e','#b97e69','#8f5849','#b9c4b0','#93aa95','#d7bcc8','#9aa6c0','#c1b3d3','#dfc66d','#b9a377','#eceae4','#aeb2ae','#71787d','#454b4e','#edc3b5','#d48674'];return `<div class="crumb">Catalog <span>›</span> Shade Finder</div><section class="panel"><div class="panel-head"><h2>Colour Shade Finder</h2><span class="meta">Digital reference</span></div><div class="side-card"><div style="display:flex;gap:8px"><input id="shadeQ" placeholder="Search shade name or code…" oninput="filterShades()" style="flex:1;height:42px;border:1px solid #d8d3cc;border-radius:12px;padding:0 12px"><button class="pill active">Search</button></div><p class="meta" style="margin:11px 0">Actual appearance can vary with lighting, substrate, application and display calibration.</p><div id="shades" class="shades">${colors.map((c,i)=>`<div class="shade" style="background:${c}"><span>${['AIRY CREAM','AIRY LEMON','ALLIGATOR ALLEY','ALL’S QUIET','ALMOND BOWL','ALMOND BISCOTTI'][i%6]} · ${i+1}P${2048+i}</span></div>`).join('')}</div></div></section>`}
function filterShades(){const q=(document.getElementById('shadeQ').value||'').toLowerCase();document.querySelectorAll('.shade').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById('modalTitle').textContent='Product Details';document.getElementById('modalBody').innerHTML=`<div class="detail"><div class="detail-top"><div>${art(p,true)}</div><div><div class="category">${esc(p.brand)} · ${esc(p.category)}</div><h1>${esc(p.name)}</h1><p style="color:#6d7478;line-height:1.6">${esc(p.description)}</p><div class="feature-list"><div class="feature"><b>Brand</b><span>${esc(p.brand)}</span></div><div class="feature"><b>Category</b><span>${esc(p.category)}</span></div><div class="feature"><b>Sub-category</b><span>${esc(p.subcategory)}</span></div></div><button class="btn" onclick="toggleFav('${p.id}');openProduct('${p.id}')">${favorites.has(p.id)?'♥ Saved':'♡ Save product'}</button> <button class="btn" style="background:var(--goldSoft)" onclick="quickAddQuote('${p.id}')">＋ Add to Quote</button></div></div><div style="margin-top:18px"><h3>Catalog description</h3><div class="copy">${esc(p.description)}</div></div><div style="margin-top:18px"><h3>Quotation reference</h3><div class="copy">Use this product in a room or project-level scope line. Working pack size, coverage and rate can be entered directly in the quotation.</div></div></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toggleFav(id,e){if(e)e.stopPropagation();favorites.has(id)?favorites.delete(id):favorites.add(id);saveLocal();renderProducts();toast(favorites.has(id)?'Product saved':'Removed from saved')}
function quickAddQuote(id,e){if(e)e.stopPropagation();const p=products.find(x=>x.id===id);if(!p)return;quoteDraft.items.push({id:'i-'+Date.now()+Math.random(),type:'Material',room:'',zone:'Interior',work:'Topcoat',productId:id,description:p.name,area:0,coats:2,coverage:0,qty:1,rate:Number(productPrices[id]||0)});saveLocal();setView('quotes');toast('Product added to quotation scope')}
function addRoom(){quoteDraft.rooms.push({id:'r-'+Date.now()+Math.random(),name:'Room '+(quoteDraft.rooms.length+1),type:'Bedroom',zone:'Interior',condition:'Sound Existing Paint',notes:'',length:12,width:12,height:10,openings:0});saveLocal();render()}
function removeRoom(i){const name=quoteDraft.rooms[i]?.name;quoteDraft.rooms.splice(i,1);quoteDraft.items.forEach(x=>{if(x.room===name)x.room=''});saveLocal();render()}
function updateRoom(i,key,val){if(!quoteDraft.rooms[i])return;quoteDraft.rooms[i][key]=['name','type','zone','condition','notes'].includes(key)?val:Number(val)||0;saveLocal();render()}
function addScopeItem(){quoteDraft.items.push({id:'i-'+Date.now()+Math.random(),type:'Material',room:quoteDraft.rooms[0]?.name||'',zone:'Interior',work:'Topcoat',productId:'',description:'',area:0,coats:2,coverage:0,qty:1,rate:0});saveLocal();render()}
function addMeasuredLabour(zone){const m=measured();const area=zone==='Exterior'?m.exterior:(m.interior+m.ceil);const rate=zone==='Exterior'?Number(quoteDraft.laborExterior)||0:Number(quoteDraft.laborInterior)||0;if(!area){toast('Add room measurements first');return}if(!rate){toast('Enter the '+zone.toLowerCase()+' labour rate first');return}quoteDraft.items.push({id:'i-'+Date.now()+Math.random(),type:'Labour',room:'Project level',zone,work:'Labour',productId:'',description:zone+' painting labour',area,coats:1,coverage:0,qty:area,rate});saveLocal();render();toast(zone+' labour added from measured area')}
function addQuickLine(type){quoteDraft.items.push({id:'i-'+Date.now()+Math.random(),type,room:quoteDraft.rooms[0]?.name||'',zone:'Interior',work:type==='Labour'?'Labour':'Other',productId:'',description:type==='Labour'?'Painting labour':'Additional charge',area:0,coats:1,coverage:0,qty:1,rate:0});saveLocal();render()}
function removeScopeItem(i){quoteDraft.items.splice(i,1);saveLocal();render()}
function updateScopeField(i,key,val){const x=quoteDraft.items[i];if(!x)return;x[key]=['area','coats','coverage','qty','rate'].includes(key)?Number(val)||0:val;if(key==='productId'){const p=products.find(p=>p.id===val);x.description=p?.name||x.description;x.rate=Number(productPrices[val]||0)}saveLocal();render()}
function saveQuoteForm(){const map=[['quoteNumber','number'],['quoteDate','date'],['customer','customer'],['phone','phone'],['email','email'],['site','site'],['city','city'],['propertyType','propertyType'],['floors','floors'],['validity','validity'],['discount','discount'],['gst','gst'],['advance','advance'],['laborInterior','laborInterior'],['laborExterior','laborExterior'],['notes','notes']];map.forEach(([id,key])=>{const e=document.getElementById(id);if(e)quoteDraft[key]=['floors','discount','gst','advance','laborInterior','laborExterior'].includes(key)?Number(e.value)||0:e.value});quoteDraft.projectType=document.querySelector('input[name="projectType"]:checked')?.value||quoteDraft.projectType;saveLocal()}
function updateQuoteSummary(){saveQuoteForm();const t=totals(),m=measured(),s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};s('qSub',money(t.sub));s('qDisc',money(t.disc));s('qTax',money(t.tax));s('qTotal',money(t.total));s('qTotal2',money(t.total));s('sumInterior',Math.round(m.interior+m.ceil).toLocaleString('en-IN'));s('sumExterior',Math.round(m.exterior).toLocaleString('en-IN'));s('sumCeil',Math.round(m.ceil).toLocaleString('en-IN'));s('sumArea',Math.round(m.interior+m.exterior+m.ceil).toLocaleString('en-IN')+' sq.ft');s('sumRooms',quoteDraft.rooms.length)}
function quotesPage(){const t=totals();return `<div class="crumb">Workspace <span>›</span> Quotations</div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h2>Premium Quotation Studio</h2><div class="meta">Detailed project intake, measurements, scope, products, labour and client-ready output</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pill" onclick="startNewQuote()">＋ New</button><button class="pill gold" onclick="saveCurrentQuote()">Save Quote</button><button class="pill active" onclick="printQuote()">Print / PDF</button></div></div></div><div class="quote-wrap"><div class="quote-stack">
<div class="quote-card"><div class="quote-card-head"><div><span class="section-step">1</span><b>Project & Customer</b></div><span class="meta">Quotation identity</span></div><div class="quote-body"><div class="form-grid"><div class="field"><label>Quotation No.</label><input id="quoteNumber" value="${esc(quoteDraft.number)}"></div><div class="field"><label>Date</label><input id="quoteDate" type="date" value="${esc(quoteDraft.date)}"></div><div class="field"><label>Customer Name</label><input id="customer" value="${esc(quoteDraft.customer)}" placeholder="Full name"></div><div class="field"><label>Mobile Number</label><input id="phone" value="${esc(quoteDraft.phone)}" placeholder="10-digit number"></div><div class="field"><label>Email</label><input id="email" value="${esc(quoteDraft.email)}" placeholder="customer@email.com"></div><div class="field"><label>City / Area</label><input id="city" value="${esc(quoteDraft.city)}" placeholder="Bengaluru"></div><div class="field full"><label>Project / Site Address</label><textarea id="site" placeholder="Full site address">${esc(quoteDraft.site)}</textarea></div><div class="field"><label>Property Type</label><select id="propertyType">${['Apartment','Villa','Independent House','Office','Commercial','Other'].map(v=>`<option ${quoteDraft.propertyType===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Floors / Levels</label><input id="floors" type="number" min="1" value="${Number(quoteDraft.floors)||1}"></div><div class="field full"><label>Project Type</label><div class="seg">${['Residential','Commercial','Repainting','New Construction','Maintenance'].map((v,i)=>`<button type="button" class="${quoteDraft.projectType===v?'active':''}" onclick="quoteDraft.projectType='${v}';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${v}</button>`).join('')}</div></div></div></div></div>
<div class="quote-card"><div class="quote-card-head"><div><span class="section-step">2</span><b>Room & Area Measurement</b></div><button class="pill gold" onclick="addRoom()">＋ Add Room / Zone</button></div><div class="quote-body"><div class="measure-grid" style="margin-bottom:13px"><div class="measure-box"><label>Interior area</label><input id="sumInterior" value="0" readonly><span class="meta">walls + ceiling</span></div><div class="measure-box"><label>Exterior area</label><input id="sumExterior" value="0" readonly><span class="meta">external walls</span></div><div class="measure-box"><label>Ceiling area</label><input id="sumCeil" value="0" readonly></div><div class="measure-box"><label>Total area</label><input id="sumArea" value="0" readonly><span class="meta">sq.ft</span></div><div class="measure-box"><label>Rooms / zones</label><input id="sumRooms" value="0" readonly></div><div class="measure-box"><label>Unit</label><input value="sq.ft" readonly></div></div><div class="room-list">${quoteDraft.rooms.length?quoteDraft.rooms.map(roomEditor).join(''):'<div class="empty" style="border:1px dashed #d8d3cc;border-radius:15px">No rooms added. Capture each room or exterior zone so the quotation has a measurement trail.</div>'}</div></div></div>
<div class="quote-card"><div class="quote-card-head"><div><span class="section-step">3</span><b>Work Scope & Products</b></div><button class="pill gold" onclick="addScopeItem()">＋ Add Scope Line</button></div><div class="quote-body"><div class="meta" style="margin-bottom:10px">Each line can represent a product system or service. Area × coats ÷ coverage calculates quantity when coverage is entered. Quantity can also be entered directly.</div><div class="scope-scroll"><table class="scope-table"><thead><tr><th>Type</th><th>Room / Zone</th><th>Area Zone</th><th>Work</th><th>Product</th><th>Area sq.ft</th><th>Coats</th><th>Coverage</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody>${quoteDraft.items.length?quoteDraft.items.map(scopeRow).join(''):'<tr><td colspan="12" class="empty">No scope lines yet. Add a product from the catalog or create a custom line.</td></tr>'}</tbody></table></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="pill" onclick="addMeasuredLabour('Interior')">＋ Interior Labour</button><button class="pill" onclick="addMeasuredLabour('Exterior')">＋ Exterior Labour</button><button class="pill" onclick="addQuickLine('Other')">＋ Other charge</button><button class="pill" onclick="setView('products')">Browse products</button></div></div></div>
<div class="quote-card"><div class="quote-card-head"><div><span class="section-step">4</span><b>Commercial Details</b></div><span class="meta">Client-facing quotation controls</span></div><div class="quote-body"><div class="form-grid three"><div class="field"><label>Discount %</label><input id="discount" type="number" min="0" max="100" value="${Number(quoteDraft.discount)||0}" oninput="saveQuoteForm();updateQuoteSummary()"></div><div class="field"><label>GST %</label><input id="gst" type="number" min="0" max="100" value="${Number(quoteDraft.gst)||0}" oninput="saveQuoteForm();updateQuoteSummary()"></div><div class="field"><label>Quotation Validity</label><input id="validity" value="${esc(quoteDraft.validity)}"></div><div class="field"><label>Advance %</label><input id="advance" type="number" min="0" max="100" value="${Number(quoteDraft.advance)||0}"></div><div class="field"><label>Interior Labour ₹/sq.ft</label><input id="laborInterior" type="number" min="0" value="${Number(quoteDraft.laborInterior)||0}"></div><div class="field"><label>Exterior Labour ₹/sq.ft</label><input id="laborExterior" type="number" min="0" value="${Number(quoteDraft.laborExterior)||0}"></div><div class="field full"><label>Terms / Notes / Exclusions</label><textarea id="notes" placeholder="Surface preparation, number of coats, payment schedule, exclusions, protection, cleanup, warranty notes…">${esc(quoteDraft.notes)}</textarea></div></div></div></div>
</div><aside class="summary"><div class="quote-card"><div class="summary-box"><div class="summary-kpi"><small>Grand Total</small><strong id="qTotal">${money(t.total)}</strong><span>after discount + GST</span></div><div class="summary-line"><span>Scope subtotal</span><strong id="qSub">${money(t.sub)}</strong></div><div class="summary-line"><span>Discount</span><strong id="qDisc">${money(t.disc)}</strong></div><div class="summary-line"><span>GST</span><strong id="qTax">${money(t.tax)}</strong></div><div class="summary-grand"><span>Payable</span><span id="qTotal2">${money(t.total)}</span></div><div class="summary-buttons"><button class="pill" onclick="saveCurrentQuote()">Save</button><button class="pill active" onclick="printQuote()">PDF</button></div></div></div><div class="quote-card" style="margin-top:14px"><div class="panel-head"><h2>Saved quotations</h2></div><div class="side-card"><div class="saved-list">${quotes.length?quotes.slice(0,6).map(q=>`<div class="saved-quote"><div><b>${esc(q.number)}</b><div class="meta">${esc(q.customer||'Customer')} · ${esc(q.date||'')}</div></div><div style="text-align:right"><span class="status">${esc(q.status||'Draft')}</span><div style="font-weight:900;margin-top:4px">${money(q.totals?.total||0)}</div><div style="margin-top:6px"><button class="pill" onclick="openSavedQuote('${esc(q.number)}')">Open</button></div></div></div>`).join(''):'<div class="empty">No saved quotations.</div>'}</div></div></div></aside></div>`}
function roomEditor(r,i){const a=roomArea(r);return `<div class="room-item"><div class="room-top"><div><div class="room-name">${esc(r.name)}</div><div class="room-meta">${esc(r.zone)} · ${esc(r.type)} · ${Math.round(a.total).toLocaleString('en-IN')} sq.ft calculated</div></div><button class="icon-btn" onclick="removeRoom(${i})">×</button></div><div class="form-grid" style="margin-top:10px"><div class="field"><label>Room / Zone Name</label><input value="${esc(r.name)}" onchange="updateRoom(${i},'name',this.value)"></div><div class="field"><label>Room Type</label><select onchange="updateRoom(${i},'type',this.value)">${['Living Room','Bedroom','Master Bedroom','Dining','Kitchen','Bathroom','Office','Passage','Staircase','Exterior Front','Exterior Side','Exterior Back','Terrace','Other'].map(v=>`<option ${r.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Zone</label><select onchange="updateRoom(${i},'zone',this.value)"><option ${r.zone==='Interior'?'selected':''}>Interior</option><option ${r.zone==='Exterior'?'selected':''}>Exterior</option></select></div><div class="field"><label>Length (ft)</label><input type="number" min="0" value="${r.length}" onchange="updateRoom(${i},'length',this.value)"></div><div class="field"><label>Width (ft)</label><input type="number" min="0" value="${r.width}" onchange="updateRoom(${i},'width',this.value)"></div><div class="field"><label>Height (ft)</label><input type="number" min="0" value="${r.height}" onchange="updateRoom(${i},'height',this.value)"></div><div class="field"><label>Doors + Windows (sq.ft)</label><input type="number" min="0" value="${r.openings}" onchange="updateRoom(${i},'openings',this.value)"></div></div><div class="form-grid" style="margin-top:10px"><div class="field"><label>Surface Condition</label><select onchange="updateRoom(${i},'condition',this.value)">${['New Plaster','Sound Existing Paint','Peeling / Flaking','Damp / Moisture','Cracked Surface','Other'].map(v=>`<option ${r.condition===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Room Notes</label><input value="${esc(r.notes||'')}" onchange="updateRoom(${i},'notes',this.value)" placeholder="Repair, protection, access, special instructions…"></div></div><div class="room-stats"><div class="stat-mini"><b>${Math.round(a.walls).toLocaleString('en-IN')}</b><span>wall sq.ft</span></div><div class="stat-mini"><b>${Math.round(a.ceil).toLocaleString('en-IN')}</b><span>ceiling sq.ft</span></div><div class="stat-mini"><b>${Math.round(a.total).toLocaleString('en-IN')}</b><span>total sq.ft</span></div><div class="stat-mini"><b>${esc(r.zone)}</b><span>quotation zone</span></div></div></div>`}
function scopeRow(x,i){const roomOptions=quoteDraft.rooms.map(r=>`<option ${x.room===r.name?'selected':''}>${esc(r.name)}</option>`).join('');const c=calcItem(x);return `<tr><td><select onchange="updateScopeField(${i},'type',this.value)"><option ${x.type==='Material'?'selected':''}>Material</option><option ${x.type==='Labour'?'selected':''}>Labour</option><option ${x.type==='Other'?'selected':''}>Other</option></select></td><td><select onchange="updateScopeField(${i},'room',this.value)"><option value="">Project level</option>${roomOptions}</select></td><td><select onchange="updateScopeField(${i},'zone',this.value)"><option ${x.zone==='Interior'?'selected':''}>Interior</option><option ${x.zone==='Exterior'?'selected':''}>Exterior</option></select></td><td><select onchange="updateScopeField(${i},'work',this.value)">${['Prep','Putty','Primer','Topcoat','Waterproofing','Ceiling','Texture','Labour','Other'].map(v=>`<option ${x.work===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="product-select" onchange="updateScopeField(${i},'productId',this.value)"><option value="">Select product</option>${products.map(p=>`<option value="${p.id}" ${x.productId===p.id?'selected':''}>${esc(p.brand)} · ${esc(p.name)}</option>`).join('')}</select></td><td><input class="narrow" type="number" min="0" step="0.01" value="${Number(c.area)||0}" onchange="updateScopeField(${i},'area',this.value)"></td><td><input class="narrow" type="number" min="1" step="1" value="${Number(x.coats)||1}" onchange="updateScopeField(${i},'coats',this.value)"></td><td><input class="narrow" type="number" min="0" step="0.01" value="${Number(x.coverage)||0}" placeholder="sq.ft/unit" onchange="updateScopeField(${i},'coverage',this.value)"></td><td><input class="narrow" type="number" min="0" step="0.01" value="${Number(c.qty).toFixed(2)}" onchange="updateScopeField(${i},'qty',this.value)"></td><td><input class="narrow" type="number" min="0" step="0.01" value="${Number(x.rate).toFixed(2)}" onchange="updateScopeField(${i},'rate',this.value)"></td><td style="white-space:nowrap;font-weight:900">${money(c.amount)}</td><td><button class="icon-btn" onclick="removeScopeItem(${i})">×</button></td></tr>`}
function pricingPage(){return `<div class="crumb">Workspace <span>›</span> Price Book</div><section class="panel"><div class="panel-head"><div><h2>Working Price Book</h2><div class="meta">Use your painter/dealer working prices. These values are local working rates, not live manufacturer pricing.</div></div><button class="pill active" onclick="savePriceBook()">Save prices</button></div><div class="toolbar"><input id="priceSearch" placeholder="Search product…" oninput="renderPricingRows()" style="height:38px;border:1px solid #d8d3cc;border-radius:999px;padding:0 14px;min-width:260px"></div><div id="pricingRows" class="product-list"></div></section>`}
function renderPricingRows(){const b=document.getElementById('pricingRows');if(!b)return;const q=(document.getElementById('priceSearch')?.value||'').toLowerCase();const arr=products.filter(p=>`${p.brand} ${p.name} ${p.category}`.toLowerCase().includes(q));b.innerHTML=arr.slice(0,120).map(p=>`<div class="product-row"><div class="prod-art ${artClass(p)}">${esc(p.initials)}</div><div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.brand)} · ${esc(p.category)}</div></div><div style="width:180px"><input class="price-input" data-id="${p.id}" type="number" min="0" step="0.01" value="${Number(productPrices[p.id]||0)}" style="width:100%;height:40px;border:1px solid #d8d3cc;border-radius:11px;padding:0 10px" placeholder="₹0"></div></div>`).join('')||'<div class="empty">No matching products.</div>'}
function savePriceBook(){document.querySelectorAll('.price-input').forEach(i=>productPrices[i.dataset.id]=Number(i.value)||0);saveLocal();toast('Working price book saved')}
function persistInputs(){saveQuoteForm();saveLocal()}
function saveCurrentQuote(){persistInputs();const t=totals();const snap={...quoteDraft,rooms:quoteDraft.rooms.map(x=>({...x})),items:quoteDraft.items.map(x=>({...x})),totals:t,status:'Draft',savedAt:new Date().toISOString()};const idx=quotes.findIndex(q=>q.number===snap.number);if(idx>=0)quotes[idx]=snap;else quotes.unshift(snap);saveLocal();render();toast('Quotation saved')}
function startNewQuote(){quoteDraft=freshQuote();saveLocal();render()}
function openSavedQuote(n){const q=quotes.find(x=>x.number===n);if(q){quoteDraft=JSON.parse(JSON.stringify(q));saveLocal();setView('quotes')}}
function printQuote(){persistInputs();const t=totals(),m=measured();const rooms=quoteDraft.rooms.map(r=>{const a=roomArea(r);return `<tr><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>${esc(r.zone)}</td><td>${esc(r.condition||'')}</td><td>${r.length} × ${r.width} × ${r.height}</td><td>${Math.round(a.walls).toLocaleString('en-IN')}</td><td>${Math.round(a.ceil).toLocaleString('en-IN')}</td><td>${Math.round(a.total).toLocaleString('en-IN')}</td></tr>`}).join('');const items=quoteDraft.items.map((x,i)=>{const c=calcItem(x),p=products.find(p=>p.id===x.productId),d=p?.name||x.description||x.work||x.type;return `<tr><td>${i+1}</td><td>${esc(d)}</td><td>${esc(x.room||'Project')}</td><td>${esc(x.zone)}</td><td>${c.qty?Number(c.qty).toFixed(2):'—'}</td><td>${money(c.rate)}</td><td>${money(c.amount)}</td></tr>`}).join('');document.getElementById('printArea').innerHTML=`<div style="background:#fff;max-width:900px;margin:auto;padding:8px;font-family:Arial,sans-serif"><div style="display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #b78b45;padding-bottom:15px"><div><div style="font-size:26px;font-weight:900">PAINT<span class="qgold" style="color:#b78b45">PRO</span></div><div style="font-size:9px;color:#777;letter-spacing:1.5px">PREMIUM PAINTER QUOTATION</div></div><div style="text-align:right;font-size:10px"><b>QUOTATION</b><div>${esc(quoteDraft.number)}</div><div>${esc(quoteDraft.date)}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;font-size:10px"><div><b>CLIENT</b><div>${esc(quoteDraft.customer||'Customer')}</div><div>${esc(quoteDraft.phone||'')}</div><div>${esc(quoteDraft.email||'')}</div></div><div><b>PROJECT</b><div>${esc(quoteDraft.site||'')}</div><div>${esc(quoteDraft.city||'')} · ${esc(quoteDraft.projectType||'')}</div><div>${esc(quoteDraft.propertyType||'')} · ${esc(quoteDraft.floors||1)} floor(s)</div></div></div><div style="margin-top:17px;font-size:10px"><b>MEASUREMENT SUMMARY</b><div style="display:flex;gap:18px;margin-top:5px"><span>Interior: <b>${Math.round(m.interior+m.ceil).toLocaleString('en-IN')} sq.ft</b></span><span>Exterior: <b>${Math.round(m.exterior).toLocaleString('en-IN')} sq.ft</b></span><span>Rooms/Zones: <b>${quoteDraft.rooms.length}</b></span></div></div><div style="margin-top:17px;font-size:10px"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;border-bottom:1px solid #ccc;padding:6px">Room / Zone</th><th style="border-bottom:1px solid #ccc">Type</th><th style="border-bottom:1px solid #ccc">Zone</th><th style="border-bottom:1px solid #ccc">Condition</th><th style="border-bottom:1px solid #ccc">Dimensions</th><th style="border-bottom:1px solid #ccc">Walls</th><th style="border-bottom:1px solid #ccc">Ceiling</th><th style="border-bottom:1px solid #ccc">Total</th></tr></thead><tbody>${rooms||'<tr><td colspan="8" style="padding:6px">No room measurements entered.</td></tr>'}</tbody></table></div><div style="margin-top:17px;font-size:10px"><b>WORK SCOPE & ESTIMATE</b><table style="width:100%;border-collapse:collapse;margin-top:6px"><thead><tr><th style="border-bottom:1px solid #ccc;padding:6px">#</th><th style="text-align:left;border-bottom:1px solid #ccc">Description</th><th style="border-bottom:1px solid #ccc">Room</th><th style="border-bottom:1px solid #ccc">Zone</th><th style="border-bottom:1px solid #ccc">Qty</th><th style="border-bottom:1px solid #ccc">Rate</th><th style="border-bottom:1px solid #ccc">Amount</th></tr></thead><tbody>${items||'<tr><td colspan="7" style="padding:6px">No scope lines.</td></tr>'}</tbody></table></div><div style="width:300px;margin-left:auto;margin-top:14px;font-size:10px"><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Subtotal</span><b>${money(t.sub)}</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Discount</span><b>${money(t.disc)}</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Taxable</span><b>${money(t.taxable)}</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>GST</span><b>${money(t.tax)}</b></div><div style="display:flex;justify-content:space-between;border-top:2px solid #b78b45;padding-top:8px;margin-top:5px;font-size:16px"><span>GRAND TOTAL</span><b>${money(t.total)}</b></div></div><div style="margin-top:18px;font-size:9px"><b>TERMS / NOTES</b><div style="white-space:pre-wrap;color:#555;margin-top:4px">${esc(quoteDraft.notes||'Quotation validity: '+quoteDraft.validity)}</div></div><div style="display:flex;justify-content:space-between;margin-top:42px;font-size:9px;color:#666"><span>Prepared by PaintPro Painter Workspace</span><span>Client Signature __________________</span></div></div>`;window.print()}
render();
</script>
</body></html>
